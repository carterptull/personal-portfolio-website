<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Brand mark: pixel "My Computer" homage — scarlet #BB0000 on gray chassis. -->
  <!-- Monitor -->
  <rect x="2" y="4" width="30" height="24" fill="#C0C0C0"/>
  <rect x="2" y="4" width="30" height="2" fill="#DFDFDF"/>
  <rect x="2" y="4" width="2" height="24" fill="#DFDFDF"/>
  <rect x="30" y="6" width="2" height="22" fill="#808080"/>
  <rect x="4" y="26" width="26" height="2" fill="#808080"/>
  <rect x="6" y="8" width="22" height="14" fill="#0A1A2E"/>
  <!-- Scarlet pixel C on screen -->
  <rect x="12" y="10" width="10" height="3" fill="#BB0000"/>
  <rect x="12" y="10" width="3" height="10" fill="#BB0000"/>
  <rect x="12" y="17" width="10" height="3" fill="#BB0000"/>
  <!-- Monitor stand -->
  <rect x="13" y="28" width="8" height="3" fill="#C0C0C0"/>
  <rect x="9" y="31" width="16" height="3" fill="#C0C0C0"/>
  <rect x="9" y="33" width="16" height="1" fill="#808080"/>
  <!-- Tower -->
  <rect x="36" y="4" width="10" height="30" fill="#C0C0C0"/>
  <rect x="36" y="4" width="10" height="1" fill="#DFDFDF"/>
  <rect x="36" y="4" width="1" height="30" fill="#DFDFDF"/>
  <rect x="45" y="5" width="1" height="29" fill="#808080"/>
  <rect x="37" y="33" width="9" height="1" fill="#808080"/>
  <rect x="38" y="7" width="6" height="2" fill="#BB0000"/>
  <rect x="38" y="11" width="6" height="1" fill="#808080"/>
  <rect x="38" y="13" width="6" height="1" fill="#808080"/>
  <rect x="38" y="28" width="2" height="2" fill="#22C55E"/>
  <!-- Keyboard -->
  <rect x="2" y="38" width="34" height="6" fill="#C0C0C0"/>
  <rect x="2" y="38" width="34" height="1" fill="#DFDFDF"/>
  <rect x="4" y="40" width="30" height="2" fill="#808080"/>
  <rect x="2" y="43" width="34" height="1" fill="#808080"/>
</svg>
