name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `npm ci` runs dependency lifecycle scripts; nothing here needs to write.
permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
